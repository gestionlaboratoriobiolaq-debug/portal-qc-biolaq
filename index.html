<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B6B50">
<title>Control interno de calidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Diseño: panel de laboratorio. Verde instrumento + estados con ícono y texto. Claro/oscuro por tokens. */
:root {
  --bg: #f1f5f3; --surface: #ffffff; --surface2: #e7eeea; --ink: #13201a; --ink2: #43554c; --muted: #66776e; --line: #d0dcd5;
  --brand: #0b6b50; --brand-h: #09563f; --on-brand: #ffffff; --brand-soft: #d6eee4; --focus: #1d6fe0; --danger: #b3261e;
  --rech-bg: #fbd5d2; --rech-fg: #7b1410; --rech-ln: #c9302c;
  --tend-bg: #ffddbe; --tend-fg: #7a3500; --tend-ln: #e5740b;
  --adv-bg: #ffefb5; --adv-fg: #664a00; --adv-ln: #d6a100;
  --ok-bg: #d5eeda; --ok-fg: #12532a; --ok-ln: #2b9a4e;
  --pend-bg: #d9e6f7; --pend-fg: #1b3c6b; --pend-ln: #3d75c2;
  --none-bg: #e3e8e5; --none-fg: #4b5953; --none-ln: #a9b5af;
  --norange-bg: #ffffff; --norange-fg: #55635c; --norange-ln: #8e9d95;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --shadow: 0 1px 2px rgba(19, 32, 26, .08), 0 2px 8px rgba(19, 32, 26, .05);
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1411; --surface: #14201b; --surface2: #1c2b25; --ink: #e6efea; --ink2: #b6c7be; --muted: #8aa095; --line: #2a3b33;
    --brand: #45c79b; --brand-h: #6fd8b3; --on-brand: #04281c; --brand-soft: #17352b; --focus: #6aa7ff; --danger: #ff8b82;
    --rech-bg: #4b1b19; --rech-fg: #ffb8b2; --rech-ln: #e5534b;
    --tend-bg: #4b2a10; --tend-fg: #ffc690; --tend-ln: #f08a2c;
    --adv-bg: #473a0b; --adv-fg: #ffe28f; --adv-ln: #e0b400;
    --ok-bg: #153a22; --ok-fg: #9fe3b2; --ok-ln: #3db766;
    --pend-bg: #172f52; --pend-fg: #acccf7; --pend-ln: #5a93e0;
    --none-bg: #26322d; --none-fg: #b4c3ba; --none-ln: #6c7c73;
    --norange-bg: #14201b; --norange-fg: #a9bbb1; --norange-ln: #6c7c73;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1411; --surface: #14201b; --surface2: #1c2b25; --ink: #e6efea; --ink2: #b6c7be; --muted: #8aa095; --line: #2a3b33;
  --brand: #45c79b; --brand-h: #6fd8b3; --on-brand: #04281c; --brand-soft: #17352b; --focus: #6aa7ff; --danger: #ff8b82;
  --rech-bg: #4b1b19; --rech-fg: #ffb8b2; --rech-ln: #e5534b;
  --tend-bg: #4b2a10; --tend-fg: #ffc690; --tend-ln: #f08a2c;
  --adv-bg: #473a0b; --adv-fg: #ffe28f; --adv-ln: #e0b400;
  --ok-bg: #153a22; --ok-fg: #9fe3b2; --ok-ln: #3db766;
  --pend-bg: #172f52; --pend-fg: #acccf7; --pend-ln: #5a93e0;
  --none-bg: #26322d; --none-fg: #b4c3ba; --none-ln: #6c7c73;
  --norange-bg: #14201b; --norange-fg: #a9bbb1; --norange-ln: #6c7c73;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: .4rem 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .pad { padding: .75rem; }
.err { color: var(--danger); } .warnt { color: var(--adv-fg); } .okt { color: var(--ok-fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1rem 0; }
.loading { padding: 3rem 1rem; text-align: center; color: var(--muted); }

/* estructura */
.app { max-width: 1120px; margin: 0 auto; padding: 0 16px 4rem; }
.staff { max-width: 820px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .7rem 0; background: var(--bg); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.brand b { font-size: 1.15rem; overflow-wrap: anywhere; }
.conn { font-size: .78rem; padding: .25rem .6rem; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.conn::before { content: ''; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; margin-right: .4rem; background: var(--ok-ln); }
.conn.pend::before { background: var(--adv-ln); } .conn.off::before { background: var(--rech-ln); }
.who-top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; }
.demo-tag { font-size: .7rem; font-weight: 600; letter-spacing: .06em; padding: .15rem .5rem; border-radius: 4px; background: var(--adv-bg); color: var(--adv-fg); border: 1px solid var(--adv-ln); }
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 3.4rem); z-index: 19; display: flex; gap: .25rem; overflow-x: auto; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 0; background: none; padding: .7rem .9rem; cursor: pointer; color: var(--ink2); border-bottom: 3px solid transparent; font-weight: 500; white-space: nowrap; }
.tab.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
.badge { display: inline-block; margin-left: .4rem; min-width: 1.3rem; padding: 0 .35rem; border-radius: 99px; background: var(--rech-ln); color: #fff; font-size: .72rem; line-height: 1.3rem; text-align: center; }
.areas { display: flex; gap: .5rem; flex-wrap: wrap; padding: .75rem 0 .25rem; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: .4rem .9rem; cursor: pointer; font-weight: 500; }
.chipbtn.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.content { padding-top: .75rem; display: block; }
.center-card { max-width: 440px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .5rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin: 0 0 .9rem; box-shadow: var(--shadow); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; } .card.flush > .tools, .card.flush > .monthnav { padding: .75rem; }
.card.slim { padding: .75rem 1rem; } .card.empty { text-align: center; padding: 2rem 1rem; }
.card h3 { margin-bottom: .5rem; }

/* controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .55rem .95rem; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); min-height: 2.4rem; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-h); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; } .btn.sm { padding: .3rem .65rem; min-height: 2rem; font-size: .88rem; }
.btn.block { display: flex; width: 100%; margin-top: .4rem; } .btn[disabled] { opacity: .45; cursor: default; }
.btns { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .9rem; } .btns.left { justify-content: flex-start; }
.linkbtn { border: 0; background: none; color: var(--brand); text-decoration: underline; cursor: pointer; padding: 0 .25rem; font-size: .85rem; }
.ico { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; padding: 0 .4rem; min-width: 1.7rem; height: 1.6rem; line-height: 1; color: var(--ink2); }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .65rem; width: 100%; min-height: 2.4rem; }
textarea { resize: vertical; } input[type=checkbox] { width: auto; min-height: 0; }
input.bad { border-color: var(--rech-ln); background: var(--rech-bg); }
label { font-size: .85rem; color: var(--ink2); font-weight: 500; }
.f { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .6rem; min-width: 0; }
.chk { display: inline-flex; gap: .4rem; align-items: center; font-size: .9rem; color: var(--ink); }
.tools { display: flex; gap: .6rem; flex-wrap: wrap; margin: .2rem 0 .7rem; } .tools input { flex: 1 1 11rem; min-width: 0; } .tools select { flex: 0 1 12rem; width: auto; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: .35rem .7rem; cursor: pointer; font-size: .85rem; } .seg-ctl button.on { background: var(--brand); color: var(--on-brand); }

/* estados */
.st { display: inline-flex; align-items: center; gap: .3rem; padding: .12rem .5rem; border-radius: 99px; font-size: .74rem; font-weight: 600; letter-spacing: .02em; border: 1px solid; white-space: nowrap; }
.st i { font-style: normal; font-weight: 700; }
.st-rech { background: var(--rech-bg); color: var(--rech-fg); border-color: var(--rech-ln); }
.st-tend { background: var(--tend-bg); color: var(--tend-fg); border-color: var(--tend-ln); }
.st-adv { background: var(--adv-bg); color: var(--adv-fg); border-color: var(--adv-ln); }
.st-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-ln); }
.st-pend { background: var(--pend-bg); color: var(--pend-fg); border-color: var(--pend-ln); }
.st-none { background: var(--none-bg); color: var(--none-fg); border-color: var(--none-ln); }
.st-norange { background: var(--norange-bg); color: var(--norange-fg); border: 1px dashed var(--norange-ln); }
.banner { display: flex; gap: .75rem; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: .7rem .9rem; border-radius: 10px; margin: .5rem 0; border: 1px solid; }
.banner.col { flex-direction: column; align-items: stretch; }
.banner.warn { background: var(--adv-bg); color: var(--adv-fg); border-color: var(--adv-ln); }
.banner.info { background: var(--pend-bg); color: var(--pend-fg); border-color: var(--pend-ln); }
.banner.bad { background: var(--rech-bg); color: var(--rech-fg); border-color: var(--rech-ln); }
.badge2 { font-size: .72rem; padding: .1rem .45rem; border-radius: 4px; background: var(--surface2); color: var(--ink2); margin-left: .4rem; } .badge2.warn { background: var(--adv-bg); color: var(--adv-fg); }

/* registro */
.datebar, .monthnav { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: .2rem 0 .6rem; }
.dlabel { display: flex; flex-direction: column; align-items: center; text-align: center; } .dlabel b { text-transform: capitalize; } .dlabel small { color: var(--muted); }
.monthnav b { text-transform: capitalize; }
.who { display: flex; gap: .6rem; align-items: center; margin: .4rem 0; } .who input { width: 8rem; text-transform: uppercase; } .who label { white-space: nowrap; }
.sum { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; margin: .6rem 0; }
.sum .k { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .3rem; text-align: center; display: flex; flex-direction: column; } .sum .k b { font-size: 1.35rem; font-family: var(--mono); } .sum .k small { color: var(--muted); font-size: .72rem; }
.sum .k.has.st-rech, .sum .k.has.st-tend, .sum .k.has.st-adv, .sum .k.has.st-pend { border-width: 1px; } .sum .k.has small { color: inherit; }
.tests { display: grid; grid-template-columns: 1fr; gap: .7rem; }
@media (min-width: 760px) { .tests { grid-template-columns: 1fr 1fr; } }
.test { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--none-ln); border-radius: 12px; padding: .75rem .8rem .8rem; min-width: 0; }
.test[hidden] { display: none; }
.test.s-rech { border-left-color: var(--rech-ln); background: linear-gradient(90deg, var(--rech-bg), var(--surface) 38%); }
.test.s-tend { border-left-color: var(--tend-ln); background: linear-gradient(90deg, var(--tend-bg), var(--surface) 38%); }
.test.s-adv { border-left-color: var(--adv-ln); } .test.s-ok { border-left-color: var(--ok-ln); } .test.s-pend { border-left-color: var(--pend-ln); }
.test > header { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; } .test > header h3 { font-size: 1.02rem; } .tstat { margin-left: auto; }
.lvs { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); }
.lvl { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
input.val { font-family: var(--mono); font-size: 1.15rem; min-height: 2.9rem; font-variant-numeric: tabular-nums; }
input.val.saved { border-color: var(--ok-ln); background: var(--ok-bg); transition: background .3s; }
input.val:disabled { background: var(--surface2); color: var(--ink2); }
.hint { color: var(--muted); font-size: .72rem; overflow-wrap: anywhere; }
.lstat { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; min-height: 1.4rem; } .z { font-size: .78rem; color: var(--ink2); }
.det { color: var(--ink2); overflow-wrap: anywhere; } .det.bad { color: var(--rech-fg); font-weight: 500; } .det.warnt { color: var(--tend-fg); }

/* hoja del mes */
.scroll { overflow-x: auto; max-width: 100%; }
.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .85rem; }
.tbl th, .tbl td { padding: .3rem .5rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl thead th { position: sticky; top: 0; background: var(--surface2); z-index: 2; font-weight: 600; font-size: .78rem; }
.tbl td.num { text-align: right; }
.matrix th.stick { position: sticky; left: 0; z-index: 3; background: var(--surface); border-right: 1px solid var(--line); text-align: left; min-width: 10.5rem; max-width: 12rem; white-space: normal; }
.matrix th.stick .nm b { display: block; font-size: .78rem; line-height: 1.15; }
.matrix th.stick .lv2 { display: flex; align-items: center; gap: .4rem; margin-top: .15rem; }
.ico.txt { font-size: .72rem; padding: .1rem .5rem; height: auto; min-width: 0; line-height: 1.3; width: auto; }
.matrix thead th.stick { z-index: 4; background: var(--surface2); }
.matrix tr.first th, .matrix tr.first td { border-top: 2px solid var(--line); }
.matrix .ghostname { color: var(--muted); font-weight: 400; } .lvb { font-size: .7rem; color: var(--muted); font-family: var(--mono); } .matrix th .ico { margin-left: .3rem; }
.dcol { text-align: center; min-width: 2.6rem; padding: .2rem .15rem !important; } .dcol span { display: block; } .dcol small { color: var(--muted); font-weight: 400; font-size: .65rem; }
.dcol.off { background: var(--none-bg) !important; } .dcol.today { color: var(--brand); box-shadow: inset 0 -3px 0 var(--brand); } .dcol.sel { background: var(--brand-soft) !important; }
.cell { text-align: center; font-family: var(--mono); font-size: .8rem; min-width: 2.6rem; cursor: pointer; }
.cell.off { background-image: linear-gradient(var(--none-bg), var(--none-bg)); background-color: var(--none-bg); }
.cell.sel { outline: 2px solid var(--brand); outline-offset: -2px; } .cell.today { box-shadow: inset 2px 0 0 var(--brand); }
.cell.z-0 { background: var(--ok-bg); color: var(--ok-fg); } .cell.z-1 { background: var(--adv-bg); color: var(--adv-fg); }
.cell.z-2 { background: var(--tend-bg); color: var(--tend-fg); font-weight: 600; } .cell.z-3 { background: var(--rech-bg); color: var(--rech-fg); font-weight: 700; }
.cell.z-none { background: var(--surface2); }
.cell.rej { box-shadow: inset 0 0 0 2px var(--rech-ln); } .cell.trd { box-shadow: inset 0 -3px 0 var(--tend-ln); }
.sc { text-align: right; font-size: .8rem; } .sc.small { font-size: .75rem; } .warnc { color: var(--tend-fg); font-weight: 600; } .badc { color: var(--rech-fg); font-weight: 700; } .okc { color: var(--ok-fg); }
.key { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .75rem; color: var(--muted); padding: .2rem .75rem .6rem; } .key span { display: inline-flex; align-items: center; gap: .35rem; }
.sw { display: inline-block; width: .9rem; height: .9rem; border-radius: 3px; border: 1px solid var(--line); }
.sw.z-0 { background: var(--ok-bg); } .sw.z-1 { background: var(--adv-bg); } .sw.z-2 { background: var(--tend-bg); } .sw.z-3 { background: var(--rech-bg); } .sw.rej { box-shadow: inset 0 0 0 2px var(--rech-ln); } .sw.off { background: var(--none-bg); }
.sw.st-rech { background: var(--rech-ln); } .sw.st-tend { background: var(--tend-ln); } .sw.st-adv { background: var(--adv-ln); } .sw.st-ok { background: var(--ok-ln); } .sw.st-pend { background: var(--pend-ln); } .sw.st-norange { background: var(--norange-bg); border-style: dashed; }

/* gráfico */
.lj { position: relative; padding: .5rem .75rem .75rem; min-width: 0; }
.lj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; flex-wrap: wrap; margin-bottom: .4rem; }
.lj-legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .8rem; } .lg { display: inline-flex; align-items: center; gap: .35rem; }
.ring { display: inline-block; width: .85rem; height: .85rem; border-radius: 50%; border: 2px solid; } .ring.warn { border-color: var(--adv-ln); } .ring.bad { border-color: var(--rech-ln); }
.lj svg { display: block; max-width: 100%; touch-action: pan-y; }
.lj-band { fill: var(--ok-bg); opacity: .45; } .lj-g { stroke: var(--line); stroke-width: 1; } .lj-g.zero { stroke: var(--ink2); stroke-width: 1.4; } .lj-g.one { stroke-dasharray: 2 4; } .lj-g.two { stroke: var(--adv-ln); stroke-dasharray: 5 4; } .lj-g.three { stroke: var(--rech-ln); stroke-width: 1.3; }
.lj-t { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); } .lj-off { fill: var(--none-ln); } .lj-cross { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.ring-warn { stroke: var(--adv-ln); } .ring-bad { stroke: var(--rech-ln); }
.lj-tip { position: absolute; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: .5rem .65rem; font-size: .82rem; pointer-events: none; min-width: 10rem; } .lj-tip .tr { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-top: .2rem; }

/* diálogos */
.modal-back, .panel-back { position: fixed; inset: 0; background: rgba(8, 16, 12, .55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); padding: 1.1rem; width: min(30rem, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: .4rem; } .modal.wide { width: min(56rem, 100%); }
.panel { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); width: min(68rem, 100%); max-height: 94vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); }
.panel-h { display: flex; align-items: center; gap: .8rem; padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); } .panel-h .muted { flex: 1; margin: 0; } .panel-h h2 { white-space: nowrap; }
.panel-b { padding: 1rem 1.1rem; overflow: auto; flex: 1; } .panel-f { display: flex; justify-content: flex-end; gap: .6rem; padding: .8rem 1.1rem; border-top: 1px solid var(--line); }
.form-grid { display: grid; grid-template-columns: 11rem 1fr; gap: .5rem .8rem; align-items: center; margin-bottom: .8rem; } @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

.dirbox { margin-top: .5rem; padding: .6rem; border-radius: 8px; background: var(--pend-bg); color: var(--pend-fg); } .cm { margin: .3rem 0; padding: .35rem .6rem; background: var(--surface2); border-radius: 8px; font-size: .88rem; }
.st-lite { font-weight: 600; } .dctl { display: grid; grid-template-columns: 10rem 1fr; gap: .5rem .8rem; margin-top: .6rem; } .dctl .f.wide { grid-column: 1 / -1; } @media (max-width: 560px) { .dctl { grid-template-columns: 1fr; } }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; margin: .4rem 0; } .dl dt { color: var(--muted); font-size: .85rem; } .dl dd { margin: 0; overflow-wrap: anywhere; } .dl.tight { gap: .15rem .8rem; }
.rules { padding-left: 1.1rem; margin: .3rem 0; } .rules li { margin: .3rem 0; } ul.plain { padding-left: 1.1rem; font-size: .88rem; }

.sec { margin: 1.2rem 0; } .sec-h { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin-bottom: .6rem; }
.alist { display: grid; gap: .5rem; } .allgood { background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-ln); border-radius: 10px; padding: .8rem; }
.arow { text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--none-ln); border-radius: 10px; padding: .6rem .8rem; cursor: pointer; display: flex; flex-direction: column; gap: .2rem; width: 100%; }

.ar-top { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; } .ar-det { color: var(--ink2); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: .8rem; }
.scard { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--ok-ln); border-radius: 12px; padding: .8rem; box-shadow: var(--shadow); min-width: 0; }
.scard.s-rech { border-top-color: var(--rech-ln); } .scard.s-tend { border-top-color: var(--tend-ln); } .scard.s-adv { border-top-color: var(--adv-ln); } .scard.s-pend { border-top-color: var(--pend-ln); } .scard.s-none, .scard.s-norange { border-top-color: var(--none-ln); }
