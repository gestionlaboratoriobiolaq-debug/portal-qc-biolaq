<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#86d4c3">
<title>Control interno de calidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Diseño: laboratorio clínico con color. Cada área tiene su color (como el tapón de un tubo de muestra);
   el día se ve como un tubo que se llena. Estados siempre con ícono + texto. Claro/oscuro por tokens. */
:root {
  --bg: #f7f9fc; --surface: #ffffff; --surface2: #f0f4f9; --field: #f6f8fb; --ink: #27324a; --ink2: #4a5670; --muted: #667389; --line: #e7ecf3; --line2: #d3dbe7;
  --brand: #86d4c3; --brand-h: #74c8b6; --on-brand: #0f3d36; --brand-soft: #e3f5f0; --brand-ink: #1a6a5c; --brand-line: #4fb39d; --focus: #4f7fe0; --danger: #c0392b;
  --logo-a: #9be0cf; --logo-b: #b9a8f0; --logo-line: #274a48;
  --rech-bg: #fde7e5; --rech-fg: #8e1f19; --rech-ln: #e4655d;
  --tend-bg: #ffe9d4; --tend-fg: #7d3a05; --tend-ln: #ee8d3a;
  --adv-bg: #fff4cc; --adv-fg: #6b5000; --adv-ln: #e0b52e;
  --ok-bg: #e1f4e6; --ok-fg: #1a5a31; --ok-ln: #4fb36f;
  --pend-bg: #e4eefb; --pend-fg: #24477c; --pend-ln: #6b9bdc;
  --none-bg: #eef1f6; --none-fg: #55627a; --none-ln: #aab4c6;
  --norange-bg: #ffffff; --norange-fg: #5a6780; --norange-ln: #9aa6bd;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --late: #e5740b;
  --shadow: 0 1px 2px rgba(39, 50, 74, .04), 0 8px 24px -16px rgba(39, 50, 74, .16); --shadow-sm: 0 1px 2px rgba(39, 50, 74, .06); --shadow-lg: 0 24px 60px -24px rgba(39, 50, 74, .32);
  --glass: rgba(247, 249, 252, .84); --glass2: rgba(255, 255, 255, .92);
  --aur1: rgba(134, 212, 195, .24); --aur2: rgba(185, 168, 240, .20); --aur3: rgba(255, 204, 170, .16);
  --ar: #6cc7b3; --ar2: #4fb39d; --ar-rgb: 108, 199, 179; --ar-soft: #e4f6f1; --ar-ink: #17695a; --ar-strong: #2f9d87;
  --display: 'Bricolage Grotesque', 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151b27; --surface: #1e2635; --surface2: #273044; --field: #19212f; --ink: #e9eef7; --ink2: #bcc7da; --muted: #98a5bd; --line: #2b3549; --line2: #3a4660;
    --brand: #86d4c3; --brand-h: #a0e0d2; --on-brand: #0d332d; --brand-soft: #1d3a36; --brand-ink: #9ee3d3; --brand-line: #86d4c3; --focus: #8fb0f5; --danger: #ff8f84;
    --logo-a: #86d4c3; --logo-b: #b9a8f0; --logo-line: #1c2f2d;
    --rech-bg: #4a2523; --rech-fg: #ffc3be; --rech-ln: #e8736b;
    --tend-bg: #4a3015; --tend-fg: #ffd0a0; --tend-ln: #f09a4a;
    --adv-bg: #453a14; --adv-fg: #ffe7a0; --adv-ln: #e3bb3a;
    --ok-bg: #1f3d2b; --ok-fg: #b2e8c3; --ok-ln: #52b972;
    --pend-bg: #223552; --pend-fg: #bcd6f8; --pend-ln: #6f9fe0;
    --none-bg: #2a3347; --none-fg: #bcc7da; --none-ln: #6b7a97;
    --norange-bg: #1e2635; --norange-fg: #b3bfd6; --norange-ln: #6b7a97;
    --s1: #4b93ea; --s2: #e8743f; --s3: #25b583; --late: #f0983c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px -16px rgba(0, 0, 0, .55); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, .7);
    --glass: rgba(21, 27, 39, .82); --glass2: rgba(30, 38, 53, .9);
    --aur1: rgba(134, 212, 195, .09); --aur2: rgba(185, 168, 240, .10); --aur3: rgba(255, 204, 170, .05);
    --ar-soft: rgba(108, 199, 179, .16); --ar-ink: #a8e6d8; --ar-strong: #6cc7b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151b27; --surface: #1e2635; --surface2: #273044; --field: #19212f; --ink: #e9eef7; --ink2: #bcc7da; --muted: #98a5bd; --line: #2b3549; --line2: #3a4660;
  --brand: #86d4c3; --brand-h: #a0e0d2; --on-brand: #0d332d; --brand-soft: #1d3a36; --brand-ink: #9ee3d3; --brand-line: #86d4c3; --focus: #8fb0f5; --danger: #ff8f84;
  --logo-a: #86d4c3; --logo-b: #b9a8f0; --logo-line: #1c2f2d;
  --rech-bg: #4a2523; --rech-fg: #ffc3be; --rech-ln: #e8736b;
  --tend-bg: #4a3015; --tend-fg: #ffd0a0; --tend-ln: #f09a4a;
  --adv-bg: #453a14; --adv-fg: #ffe7a0; --adv-ln: #e3bb3a;
  --ok-bg: #1f3d2b; --ok-fg: #b2e8c3; --ok-ln: #52b972;
  --pend-bg: #223552; --pend-fg: #bcd6f8; --pend-ln: #6f9fe0;
  --none-bg: #2a3347; --none-fg: #bcc7da; --none-ln: #6b7a97;
  --norange-bg: #1e2635; --norange-fg: #b3bfd6; --norange-ln: #6b7a97;
  --s1: #4b93ea; --s2: #e8743f; --s3: #25b583; --late: #f0983c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px -16px rgba(0, 0, 0, .55); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, .7);
  --glass: rgba(21, 27, 39, .82); --glass2: rgba(30, 38, 53, .9);
  --aur1: rgba(134, 212, 195, .09); --aur2: rgba(185, 168, 240, .10); --aur3: rgba(255, 204, 170, .05);
  --ar-soft: rgba(108, 199, 179, .16); --ar-ink: #a8e6d8; --ar-strong: #6cc7b3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(58rem 36rem at 6% -10%, var(--aur1), transparent 62%), radial-gradient(50rem 34rem at 104% -4%, var(--aur2), transparent 58%), radial-gradient(46rem 30rem at 50% 118%, var(--aur3), transparent 62%); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; font-family: var(--display); letter-spacing: -.012em; font-weight: 700; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.22rem; } h3 { font-size: 1.05rem; } h4 { font-size: 1rem; }
p { margin: .4rem 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .86rem; } .pad { padding: .75rem; }
.err { color: var(--danger); } .warnt { color: var(--adv-fg); } .okt { color: var(--ok-fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1rem 0; }
.loading { display: flex; flex-direction: column; align-items: center; gap: .8rem; padding: 4rem 1rem; text-align: center; color: var(--muted); }
.loading::before { content: ''; width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ic { flex: none; }

/* estructura */
.app { max-width: 1120px; margin: 0 auto; padding: 0 18px 4rem; }
.staff { max-width: 860px; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: .75rem; height: calc(3.9rem + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 0 0; }
.top::before { content: ''; position: absolute; z-index: -1; left: calc(50% - 50vw); right: calc(50% - 50vw); top: 0; bottom: 0; background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }
.brand { display: flex; align-items: center; gap: .7rem; min-width: 0; }
.logo { flex: none; filter: drop-shadow(0 5px 8px rgba(74, 85, 224, .3)); }
.bt { display: flex; flex-direction: column; min-width: 0; }
.bt b { font-family: var(--display); font-size: 1.12rem; line-height: 1.15; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bt small { font-size: .76rem; color: var(--muted); white-space: nowrap; }
.conn { font-size: .78rem; font-weight: 600; padding: .3rem .7rem; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; box-shadow: var(--shadow-sm); color: var(--ink2); }
.conn::before { content: ''; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; margin-right: .45rem; background: var(--ok-ln); }
.conn.pend::before { background: var(--adv-ln); animation: blink 1s ease-in-out infinite; } .conn.off::before { background: var(--rech-ln); }
@keyframes blink { 50% { opacity: .3; } }
.who-top { display: flex; align-items: center; gap: .6rem; justify-content: flex-end; min-width: 0; }
.who-top small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem; }
.demo-tag { font-size: .72rem; font-weight: 700; padding: .18rem .6rem; border-radius: 99px; background: var(--adv-bg); color: var(--adv-fg); border: 1px solid var(--adv-ln); white-space: nowrap; }

.tabs { display: flex; gap: .3rem; padding: .3rem; margin: .2rem 0 .8rem; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.director .tabs { position: sticky; top: calc(3.9rem + env(safe-area-inset-top, 0px)); z-index: 25; }
.tab { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border: 0; background: none; padding: .6rem 1rem; border-radius: 14px; cursor: pointer; color: var(--ink2); font-weight: 600; white-space: nowrap; transition: background .15s, color .15s; }
.tab:hover { background: var(--surface2); }
.tab.on { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 16px -8px rgba(10, 127, 115, .7); }
.tic { display: inline-flex; position: relative; }
.badge { display: inline-block; min-width: 1.3rem; padding: 0 .38rem; border-radius: 99px; background: var(--rech-ln); color: #fff; font-size: .72rem; font-weight: 700; line-height: 1.3rem; text-align: center; }
.badge.warn { background: var(--adv-ln); color: #3d2b00; }
.tic .badge { position: absolute; top: -.55rem; right: -.85rem; line-height: 1.1rem; min-width: 1.1rem; border: 2px solid var(--surface); }
.tab .badge { margin-left: .1rem; } .tab.on .badge { box-shadow: 0 0 0 2px var(--brand); }

.areas { display: flex; gap: .5rem; flex-wrap: wrap; padding: .15rem 0 .35rem; }
.chipbtn { display: inline-flex; align-items: center; gap: .5rem; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: .45rem 1rem .45rem .8rem; cursor: pointer; font-weight: 600; color: var(--ink2); box-shadow: var(--shadow-sm); transition: border-color .15s, transform .15s, box-shadow .15s; }
.chipbtn .dot, .aline .dot { display: inline-block; flex: none; width: .72rem; height: .72rem; border-radius: 50%; background: linear-gradient(135deg, var(--ar), var(--ar2)); box-shadow: 0 0 0 2px rgba(var(--ar-rgb), .22); }
.chipbtn:hover { border-color: var(--ar2); }
.chipbtn.on { background: linear-gradient(125deg, var(--ar), var(--ar2)); border-color: transparent; color: #fff; box-shadow: 0 10px 18px -10px rgba(var(--ar-rgb), .8); }
.chipbtn.on .dot { background: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, .35); }
.content { padding-top: .5rem; display: block; }
.center-card { max-width: 440px; margin: 10vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 1.8rem 1.6rem; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: .55rem; align-items: flex-start; }
.center-card .logo { width: 56px; height: 56px; margin-bottom: .3rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.05rem 1.1rem; margin: 0 0 .9rem; box-shadow: var(--shadow); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; } .card.flush > .tools, .card.flush > .monthnav { padding: .75rem; }
.card.slim { padding: .75rem 1rem; } .card.empty { text-align: center; padding: 2.2rem 1rem; }
.card h3 { margin-bottom: .55rem; }

/* controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 1px solid var(--line2); background: var(--surface); border-radius: 12px; padding: .55rem 1rem; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); min-height: 2.5rem; transition: background .15s, transform .1s, box-shadow .15s; }
.btn:hover { background: var(--surface2); } .btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: 0 8px 16px -10px rgba(10, 127, 115, .9); }
.btn.primary:hover { background: var(--brand-h); border-color: var(--brand-h); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; } .btn.sm { padding: .3rem .75rem; min-height: 2.1rem; font-size: .88rem; white-space: nowrap; }
.btn.round { width: 2.3rem; height: 2.3rem; padding: 0; border-radius: 50%; flex: none; }
.btn.block { display: flex; width: 100%; margin-top: .4rem; } .btn[disabled] { opacity: .4; cursor: default; box-shadow: none; }
.btns { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .9rem; } .btns.left { justify-content: flex-start; }
.linkbtn { border: 0; background: none; color: var(--brand); text-decoration: underline; cursor: pointer; padding: 0 .25rem; font-size: .85rem; font-weight: 600; }
button.ico, .ico { border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; cursor: pointer; padding: 0 .4rem; min-width: 1.8rem; height: 1.7rem; line-height: 1; color: var(--ink2); }
input, select, textarea { background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: .5rem .7rem; width: 100%; min-height: 2.5rem; transition: border-color .15s, box-shadow .15s, background .15s; }
input:focus, select:focus, textarea:focus { background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 4px rgba(var(--ar-rgb), .16); outline: none; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
textarea { resize: vertical; } input[type=checkbox] { width: auto; min-height: 0; accent-color: var(--brand); }
input.bad { border-color: var(--rech-ln); background: var(--rech-bg); }
label { font-size: .86rem; color: var(--ink2); font-weight: 600; }
.f { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .6rem; min-width: 0; }
.chk { display: inline-flex; gap: .45rem; align-items: center; font-size: .9rem; color: var(--ink); }
.tools { display: flex; gap: .6rem; flex-wrap: wrap; margin: .2rem 0 .8rem; } .tools input { flex: 1 1 11rem; min-width: 0; } .tools select { flex: 0 1 12rem; width: auto; }
.seg-ctl { display: inline-flex; padding: .2rem; gap: .15rem; background: var(--surface2); border-radius: 12px; }
.seg-ctl button { border: 0; background: none; padding: .35rem .8rem; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--ink2); border-radius: 9px; } .seg-ctl button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* estados */
.st { display: inline-flex; align-items: center; gap: .3rem; padding: .14rem .55rem; border-radius: 99px; font-size: .75rem; font-weight: 700; letter-spacing: .01em; border: 1px solid; white-space: nowrap; }
.st i { font-style: normal; font-weight: 800; }
.st-rech { background: var(--rech-bg); color: var(--rech-fg); border-color: var(--rech-ln); }
.st-tend { background: var(--tend-bg); color: var(--tend-fg); border-color: var(--tend-ln); }
.st-adv { background: var(--adv-bg); color: var(--adv-fg); border-color: var(--adv-ln); }
.st-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-ln); }
.st-pend { background: var(--pend-bg); color: var(--pend-fg); border-color: var(--pend-ln); }
.st-none { background: var(--none-bg); color: var(--none-fg); border-color: var(--none-ln); }
.st-norange { background: var(--norange-bg); color: var(--norange-fg); border: 1px dashed var(--norange-ln); }
.banner { display: flex; gap: .75rem; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: .75rem 1rem; border-radius: 16px; margin: .5rem 0 .8rem; border: 1px solid; }
.banner.col { flex-direction: column; align-items: stretch; }
.banner.warn { background: var(--adv-bg); color: var(--adv-fg); border-color: var(--adv-ln); }
.banner.info { background: var(--pend-bg); color: var(--pend-fg); border-color: var(--pend-ln); }
.banner.bad { background: var(--rech-bg); color: var(--rech-fg); border-color: var(--rech-ln); }
.badge2 { font-size: .72rem; font-weight: 600; padding: .1rem .5rem; border-radius: 99px; background: var(--surface2); color: var(--ink2); margin-left: .4rem; } .badge2.warn { background: var(--adv-bg); color: var(--adv-fg); }

/* ---- día: tarjeta de avance ---- */
.hero { position: relative; isolation: isolate; overflow: hidden; border-radius: 28px; padding: .85rem 1rem 1rem; margin: .1rem 0 1rem; color: #fff; background: linear-gradient(125deg, var(--ar) 0%, var(--ar) 30%, var(--ar2) 100%); box-shadow: 0 22px 40px -22px rgba(var(--ar-rgb), .85), 0 2px 6px rgba(20, 32, 56, .12); transition: background .4s; }
.hero::before, .hero::after { content: ''; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; }
.hero::before { width: 17rem; height: 17rem; right: -5rem; top: -8rem; background: radial-gradient(closest-side, rgba(255, 255, 255, .26), transparent); }
.hero::after { width: 13rem; height: 13rem; left: -4rem; bottom: -8rem; background: radial-gradient(closest-side, rgba(255, 255, 255, .15), transparent); }
.hero.done { --ar: #0b7a43; --ar2: #108a50; --ar-rgb: 11, 122, 67; }
.hnav { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.hbtn { display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .18); color: #fff; cursor: pointer; transition: background .15s; }
.hbtn:hover { background: rgba(255, 255, 255, .32); } .hbtn[disabled] { opacity: .3; cursor: default; } .hbtn:focus-visible, .hlink:focus-visible, .vial:focus-visible { outline-color: #fff; }
.hdate { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.2; }
.hdate b { display: block; font-family: var(--display); font-weight: 600; font-size: 1rem; } .hdate b::first-letter { text-transform: uppercase; }
.hdate small { color: rgba(255, 255, 255, .85); font-size: .8rem; }
.hlink { border: 0; background: rgba(255, 255, 255, .2); color: #fff; font-size: .78rem; font-weight: 600; border-radius: 99px; padding: .1rem .65rem; margin-top: .15rem; cursor: pointer; } .hlink:hover { background: rgba(255, 255, 255, .34); }
.hmain { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: .75rem 0 .85rem; }
.htext { min-width: 0; }
.hmsg { font-size: 1.75rem; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.hsub { margin: .4rem 0 0; font-size: .92rem; color: rgba(255, 255, 255, .92); text-wrap: pretty; }
.ring2 { position: relative; flex: none; width: 84px; height: 84px; }
.ring2 svg { display: block; }
.rg-bg { fill: none; stroke: rgba(255, 255, 255, .25); stroke-width: 8; }
.rg-fg { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .7s cubic-bezier(.3, .8, .3, 1); }
.rg-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.rg-txt b { font-family: var(--display); font-size: 1.7rem; font-weight: 800; } .rg-txt small { font-size: .62rem; margin-top: .15rem; color: rgba(255, 255, 255, .88); }

/* ================= Capa pastel y minimalista ================= */
.logo { filter: none; }
body::before { opacity: 1; }
.tab.on { background: var(--brand-soft); color: var(--brand-ink); box-shadow: inset 0 0 0 1.5px var(--brand-line); }
.tab:hover { background: var(--surface2); }
.tab.on .badge { box-shadow: 0 0 0 2px var(--brand-soft); }
.btn.primary { background: var(--brand); border-color: var(--brand-line); color: var(--on-brand); box-shadow: none; }
.btn.primary:hover { background: var(--brand-h); border-color: var(--brand-line); }
.linkbtn { color: var(--brand-ink); }
input:focus, select:focus, textarea:focus { border-color: var(--brand-line); box-shadow: 0 0 0 4px rgba(var(--ar-rgb), .22); }
.loading::before { border-top-color: var(--brand-line); }
.conn { box-shadow: none; }

.card, .scard, .eqcard, .test, .tile, .datebar { box-shadow: var(--shadow); }
.center-card { box-shadow: var(--shadow-lg); }

/* tarjeta del día (suave, con texto oscuro) */
.hero { color: var(--ink); background: linear-gradient(145deg, var(--ar-soft) 0%, var(--surface) 82%); border: 1px solid rgba(var(--ar-rgb), .38); box-shadow: var(--shadow); }
.hero::before { background: radial-gradient(closest-side, rgba(var(--ar-rgb), .22), transparent); }
.hero::after { background: radial-gradient(closest-side, rgba(var(--ar-rgb), .12), transparent); }
.hero.done { --ar: #8fd6a8; --ar2: #6cc28c; --ar-rgb: 111, 194, 140; --ar-soft: #e3f6ea; --ar-ink: #1d6a3c; --ar-strong: #3aa564; }
.hbtn { background: rgba(var(--ar-rgb), .2); color: var(--ar-ink); }
.hbtn:hover { background: rgba(var(--ar-rgb), .36); }
.hbtn:focus-visible, .hlink:focus-visible, .vial:focus-visible { outline-color: var(--focus); }
.hdate small { color: var(--ink2); }
.hlink { background: rgba(var(--ar-rgb), .2); color: var(--ar-ink); } .hlink:hover { background: rgba(var(--ar-rgb), .36); }
.hmsg { color: var(--ink); }
.hsub { color: var(--ink2); }
.rg-bg { stroke: rgba(var(--ar-rgb), .28); }
.rg-fg { stroke: var(--ar-strong); }
.rg-txt b { color: var(--ink); } .rg-txt small { color: var(--ink2); }
.hchip { background: rgba(var(--ar-rgb), .16); color: var(--ar-ink); }
.hchip.has.st-rech { background: var(--rech-bg); color: var(--rech-fg); } .hchip.has.st-tend { background: var(--tend-bg); color: var(--tend-fg); } .hchip.has.st-adv { background: var(--adv-bg); color: var(--adv-fg); }
.hchip.streak { background: #fff0c2; color: #5a4100; }
.hchip.gap { background: var(--adv-bg); color: var(--adv-fg); } .hchip.gap:hover { background: #ffeaa0; }
.rack { background: rgba(var(--ar-rgb), .11); }
.vial .cap { background: rgba(var(--ar-rgb), .45); }
.vial .tube { border-color: rgba(var(--ar-rgb), .7); background: rgba(255, 255, 255, .5); }
.vial .liq { background: var(--ar2); opacity: 1; }
.vial.full .cap { background: var(--ok-ln); } .vial.part .cap { background: var(--ar2); }
.vial.today .cap, .vial.today::after { background: #f2b94b; }
.vial.sel::after { background: var(--ar-strong); }
.vial.off .tube { border-color: rgba(var(--ar-rgb), .4); }
.vial.miss .tube { border-color: #e0b52e; } .vial.miss .cap { background: #e0b52e; }
.conf { box-shadow: none; }

/* mosaicos y tarjetas con menos brillo */
.tile .tg { background: var(--brand-soft); color: var(--brand-ink); }
.tile.has.st-rech .tg { background: var(--rech-ln); color: #fff; } .tile.has.st-pend .tg { background: var(--pend-ln); color: #fff; }
.scard::before { height: 5px; }
.eqcard::before { height: 5px; background: linear-gradient(90deg, var(--ar), var(--ar2)); }
.test::before { width: 5px; }
.demo-tag { background: var(--adv-bg); color: var(--adv-fg); }

/* ---------- eventos del equipo ---------- */
.evbar { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; margin: 0 0 .8rem; }
.evpill { display: inline-flex; align-items: center; gap: .4rem; padding: .22rem .7rem .22rem .3rem; border-radius: 99px; background: var(--surface); border: 1px solid var(--line2); font-size: .82rem; font-weight: 600; color: var(--ink2); max-width: 100%; }
.evpill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evk, .evpill i, .evflag { display: inline-grid; place-items: center; flex: none; min-width: 1.3rem; height: 1.3rem; padding: 0 .25rem; border-radius: 7px; font-size: .72rem; font-weight: 800; font-style: normal; background: #e9e4fb; color: #46338f; }
.ev-cal { background: #dff3ee !important; color: #135f51 !important; } .ev-rea { background: #e9e4fb !important; color: #46338f !important; } .ev-ctl { background: #fbe4ef !important; color: #86285a !important; }
.ev-man { background: #ffeccc !important; color: #6e4300 !important; } .ev-otr { background: #e9edf3 !important; color: #475268 !important; }
.evpill.ev-cal, .evpill.ev-rea, .evpill.ev-ctl, .evpill.ev-man, .evpill.ev-otr { background: var(--surface) !important; color: var(--ink2) !important; }
.evcard .evlist { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.evlist li { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; padding: .35rem .5rem; border-radius: 12px; font-size: .9rem; }
.evlist li.cur { background: var(--ar-soft); }
.evlist .evd { font-family: var(--mono); font-size: .8rem; color: var(--muted); } .evlist .evt { flex: 1 1 12rem; }
.evflag { background: var(--surface); border: 1px solid var(--line2); }
.lj-ev { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 2 3; opacity: .55; }
.lj-evflag rect { fill: var(--surface2); stroke: var(--line2); } .lj-evflag text { fill: var(--ink); font-size: 10.5px; font-weight: 800; font-family: var(--font); }
.lj-tip .tr.ev { margin-top: .2rem; color: var(--ink2); }
th.hasev { position: relative; }
.evmark { display: block; font-style: normal; font-size: .55rem; font-weight: 800; line-height: 1; color: var(--ar-ink); letter-spacing: -.02em; }

/* ---------- cierre del mes ---------- */
.closedbn { align-items: flex-start; justify-content: flex-start; } .closedbn svg { margin-top: .15rem; }
.banner svg { flex: none; }
.banner > span { flex: 1 1 16rem; min-width: 0; }
.banner { justify-content: flex-start; }
.banner > .btn { margin-left: auto; }
.evbox:empty { display: none; }
.evbox { margin: .1rem 0 .4rem; }
.closurecard { border-left: 5px solid var(--line2); } .closurecard.closed { border-left-color: var(--pend-ln); background: linear-gradient(100deg, var(--pend-bg), var(--surface) 55%); }
.closurecard h3 { display: inline-flex; align-items: center; gap: .4rem; margin: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; margin: 0 0 .5rem; }
.chklist { list-style: none; margin: .5rem 0; padding: 0; display: grid; gap: .4rem; }
.chklist li { display: flex; gap: .55rem; align-items: flex-start; font-size: .92rem; }
.chklist li i { flex: none; display: inline-grid; place-items: center; width: 1.3rem; height: 1.3rem; border-radius: 50%; font-style: normal; font-weight: 800; font-size: .8rem; background: var(--none-bg); color: var(--none-fg); }
.chklist li.warn i { background: var(--adv-bg); color: var(--adv-fg); border: 1px solid var(--adv-ln); }
.integ { display: block; margin-top: .2rem; }

/* ---------- calidad analítica ---------- */
.lead { max-width: 62rem; margin: .2rem 0 .8rem; }
.seg-ctl.big { margin: .1rem 0 .9rem; flex-wrap: wrap; } .seg-ctl.big button { padding: .5rem 1rem; font-size: .92rem; }
.qtbl th, .qtbl td { vertical-align: middle; }

.qtbl .qc { text-align: center; }
.qtbl .qm { display: block; font-size: .72rem; margin-top: .1rem; }
.qarea th { background: var(--ar-soft, var(--surface2)); font-size: .8rem; text-align: left; color: var(--ink2); }
.qrow { cursor: pointer; } .qrow:hover td { background: var(--surface2); } .qrow.open td { background: var(--ar-soft); }
.qrow:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.qdetail > td { padding: 0 !important; white-space: normal; background: var(--field); }
.qd { padding: .9rem 1rem 1rem; display: grid; gap: .8rem; } .qd h4 { font-size: 1rem; }
.qfig { display: grid; gap: .3rem; max-width: 40rem; }
.qplot { width: 100%; height: auto; display: block; }
.qp-t { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); } .qp-v { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--mono); }
.qp-bar { stroke-width: 3; stroke-linecap: round; opacity: .55; } .qp-ref { stroke: var(--ink2); stroke-dasharray: 3 3; stroke-width: 1; }
.qp-band { fill: var(--ok-bg); opacity: .55; }
.lg .dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; }
.sg { display: inline-block; min-width: 2.6rem; text-align: center; padding: .12rem .55rem; border-radius: 99px; font-family: var(--mono); font-weight: 700; font-size: .85rem; border: 1px solid; }
.sg-a { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-ln); } .sg-b { background: #e8f5df; color: #2f5a1a; border-color: #8cc46a; }
.sg-c { background: var(--pend-bg); color: var(--pend-fg); border-color: var(--pend-ln); } .sg-d { background: var(--adv-bg); color: var(--adv-fg); border-color: var(--adv-ln); }
.sg-e { background: var(--rech-bg); color: var(--rech-fg); border-color: var(--rech-ln); } .sg-na { background: var(--none-bg); color: var(--none-fg); border-color: var(--none-ln); }
.qin { width: 5.2rem; text-align: right; font-family: var(--mono); min-height: 2.1rem; padding: .25rem .5rem; } .qin.wide { width: 16rem; max-width: 100%; text-align: left; font-family: var(--font); }
.tiles.small .tile b { font-size: 1.5rem; }

/* ---------- historial de cambios ---------- */
.histtbl .hdet { white-space: normal; min-width: 16rem; overflow-wrap: anywhere; } .nw { white-space: nowrap; }
.histtbl tr.corr td { background: var(--adv-bg); }
.kind { display: inline-block; padding: .08rem .55rem; border-radius: 99px; font-size: .74rem; font-weight: 700; background: var(--surface2); color: var(--ink2); }
.kind.k-val { background: var(--pend-bg); color: var(--pend-fg); } .kind.k-cfg, .kind.k-lote { background: #ece7fb; color: #46338f; } .kind.k-cierre, .kind.k-reapertura { background: var(--ok-bg); color: var(--ok-fg); }
.kind.k-ev { background: #dff3ee; color: #135f51; } .kind.k-bit { background: var(--tend-bg); color: var(--tend-fg); }

/* ---------- apariencia ---------- */
.appear { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: center; }
.swatches { display: inline-flex; gap: .5rem; }
.swatch { width: 2.3rem; height: 2.3rem; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line2); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--ink); }
.sw-menta { background: #86d4c3; } .sw-lavanda { background: #c1b4f2; } .sw-celeste { background: #9cc7f5; }

/* ---------- informe imprimible ---------- */
.report-overlay { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; background: var(--bg); }
.report-bar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; padding: .6rem 1rem; background: var(--surface); border-bottom: 1px solid var(--line); }
.report-bar .sp { flex: 1; }
.report-scroll { flex: 1; overflow: auto; padding: 1rem; }
.report-doc { width: 794px; max-width: 100%; margin: 0 auto; padding: 28px 30px; background: #fff; color: #1c2433; box-shadow: var(--shadow-lg); border-radius: 6px; font-size: 13px; line-height: 1.45;
    --bg: #f7f9fc; --surface: #ffffff; --surface2: #f0f4f9; --field: #f6f8fb; --ink: #27324a; --ink2: #4a5670; --muted: #667389; --line: #e7ecf3; --line2: #d3dbe7;
    --brand: #86d4c3; --brand-h: #74c8b6; --on-brand: #0f3d36; --brand-soft: #e3f5f0; --brand-ink: #1a6a5c; --brand-line: #4fb39d; --focus: #4f7fe0; --danger: #c0392b;
    --logo-a: #9be0cf; --logo-b: #b9a8f0; --logo-line: #274a48;
    --rech-bg: #fde7e5; --rech-fg: #8e1f19; --rech-ln: #e4655d;
    --tend-bg: #ffe9d4; --tend-fg: #7d3a05; --tend-ln: #ee8d3a;
    --adv-bg: #fff4cc; --adv-fg: #6b5000; --adv-ln: #e0b52e;
    --ok-bg: #e1f4e6; --ok-fg: #1a5a31; --ok-ln: #4fb36f;
    --pend-bg: #e4eefb; --pend-fg: #24477c; --pend-ln: #6b9bdc;
    --none-bg: #eef1f6; --none-fg: #55627a; --none-ln: #aab4c6;
    --norange-bg: #ffffff; --norange-fg: #5a6780; --norange-ln: #9aa6bd;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --late: #e5740b;
    --shadow: 0 1px 2px rgba(39, 50, 74, .04), 0 8px 24px -16px rgba(39, 50, 74, .16); --shadow-sm: 0 1px 2px rgba(39, 50, 74, .06); --shadow-lg: 0 24px 60px -24px rgba(39, 50, 74, .32);
    --glass: rgba(247, 249, 252, .84); --glass2: rgba(255, 255, 255, .92);
    --aur1: rgba(134, 212, 195, .24); --aur2: rgba(185, 168, 240, .20); --aur3: rgba(255, 204, 170, .16);
    --ar: #6cc7b3; --ar2: #4fb39d; --ar-rgb: 108, 199, 179; --ar-soft: #e4f6f1; --ar-ink: #17695a; --ar-strong: #2f9d87;
    --display: 'Bricolage Grotesque', 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.report-doc h1 { font-size: 1.35rem; } .report-doc h2 { font-size: 1.02rem; margin: 1.1rem 0 .4rem; padding-bottom: .2rem; border-bottom: 1.5px solid #cfd8e6; } .report-doc p { margin: .3rem 0; }
.rp-sec + .rp-sec { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 2px dashed #cfd8e6; }
.rp-head { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; } .rp-sub { color: #44526d; font-size: .95rem; margin: .2rem 0 0; }
.rp-state { flex: none; padding: .25rem .7rem; border-radius: 6px; font-weight: 800; font-size: .74rem; letter-spacing: .04em; border: 1.5px solid; } .rp-state.closed { color: #1a5a31; border-color: #4fb36f; background: #e1f4e6; } .rp-state.open { color: #6b5000; border-color: #e0b52e; background: #fff4cc; }
.rp-dl { display: grid; grid-template-columns: 9rem 1fr 9rem 1fr; gap: .15rem .8rem; margin: .8rem 0; font-size: .9em; } .rp-dl dt { color: #55627a; font-weight: 600; } .rp-dl dd { margin: 0; }
.rp-tbl { width: 100%; border-collapse: collapse; font-size: .86em; } .rp-tbl th, .rp-tbl td { border: 1px solid #d3dbe7; padding: .22rem .4rem; text-align: left; vertical-align: top; } .rp-tbl th { background: #eef2f8; font-size: .9em; }
.rp-stat td:nth-child(n+3):not(:last-child) { text-align: right; font-family: var(--mono); }
.rp-note { color: #55627a; font-size: .85em; }
.rp-charts { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; } .rp-chart { margin: 0; border: 1px solid #d3dbe7; border-radius: 8px; padding: .4rem .5rem; break-inside: avoid; } .rp-chart figcaption { font-weight: 700; font-size: .95em; }
.rp-chart .lj-legend { font-size: .72rem; } .rp-chart .lj-head .btn { display: none; }
.rp-close { border: 1.5px solid #4fb36f; border-radius: 8px; padding: .4rem .8rem; background: #f3fbf5; }
.rp-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-top: 2.2rem; } .rp-sign div { display: flex; flex-direction: column; gap: .15rem; } .rp-sign i { display: block; border-bottom: 1.5px solid #1c2433; height: 2.2rem; } .rp-sign span { font-weight: 700; } .rp-sign small { color: #55627a; }
.report-doc .btn { display: none; }
@media (max-width: 700px) { .rp-dl { grid-template-columns: 7rem 1fr; } .rp-charts { grid-template-columns: 1fr; } .report-scroll { padding: .4rem; } .report-doc { padding: 18px 14px; } }
@media print {
  @page { size: A4; margin: 12mm; }
  body.printing { background: #fff; }
  body.printing > #app, body.printing .toasts, body.printing .modal-back { display: none !important; }
  .report-overlay { position: static; display: block; background: #fff; }
  .report-bar { display: none; }
  .report-scroll { overflow: visible; padding: 0; }
  .report-doc { width: auto; box-shadow: none; border-radius: 0; padding: 0; }
  .rp-sec + .rp-sec { break-before: page; margin-top: 0; padding-top: 0; border-top: 0; }
  .report-doc h2 { break-after: avoid; } .rp-tbl tr { break-inside: avoid; }
}
